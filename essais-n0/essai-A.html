<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astro-Guide – Chatbot d'observation du ciel</title>
<style>
  :root {
    --bg: #070b1a;
    --panel: #0f1630;
    --panel-2: #172044;
    --border: #243059;
    --text: #e6eaf7;
    --muted: #8f9bc4;
    --accent: #ffcf6b;
    --accent-2: #7aa2ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 80% -10%, #1b2a66 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #2a1a52 0%, transparent 55%),
      var(--bg);
    display: flex;
    justify-content: center;
    align-items: stretch;
  }
  #stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .app {
    position: relative; z-index: 1;
    width: 100%; max-width: 820px;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: 16px;
    gap: 12px;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: rgba(15, 22, 48, 0.85);
    border: 1px solid var(--border);
    border-radius: 14px;
    backdrop-filter: blur(6px);
  }
  .logo {
    width: 42px; height: 42px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff3c9, var(--accent) 45%, #c98a1b 100%);
    box-shadow: 0 0 18px rgba(255, 207, 107, 0.45);
    flex-shrink: 0;
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  header p { margin: 2px 0 0; font-size: 0.82rem; color: var(--muted); }
  #chat {
    flex: 1; overflow-y: auto;
    padding: 14px;
    background: rgba(15, 22, 48, 0.7);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 86%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 0.95rem;
    animation: pop 0.18s ease-out;
    white-space: pre-wrap;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .user { align-self: flex-end; background: linear-gradient(135deg, #3555c9, #5b7cf0); border-top-right-radius: 4px; }
  .msg b { color: var(--accent); }
  .msg .tag { color: var(--accent-2); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: transparent; color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 13px; font-size: 0.82rem; cursor: pointer;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: rgba(255, 207, 107, 0.08); }
  form {
    display: flex; gap: 8px;
    background: rgba(15, 22, 48, 0.9);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
  }
  input[type="text"] {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 1rem; padding: 8px 10px;
  }
  input::placeholder { color: var(--muted); }
  button.send {
    background: var(--accent); color: #1a1405; border: none;
    border-radius: 10px; padding: 0 20px; font-weight: 700; cursor: pointer;
    transition: transform 0.1s, filter 0.15s;
  }
  button.send:hover { filter: brightness(1.08); }
  button.send:active { transform: scale(0.97); }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  @media (max-width: 520px) {
    .app { padding: 10px; }
    .msg { max-width: 94%; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="app">
  <header>
    <div class="logo"></div>
    <div>
      <h1>Astro-Guide</h1>
      <p>Ton assistant pour l'observation du ciel · Hémisphère nord</p>
    </div>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div class="chips" id="chips"></div>

  <form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="Pose ta question : Lune, planètes, matériel, étoiles filantes…" aria-label="Ta question">
    <button class="send" type="submit">Envoyer</button>
  </form>
</div>

<script>
(function () {
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let stars = [];
  function resizeStars() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({ length: 140 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.2,
      p: Math.random() * Math.PI * 2,
      s: 0.5 + Math.random() * 1.5
    }));
  }
  function drawStars(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const st of stars) {
      const a = 0.35 + 0.65 * Math.abs(Math.sin(t / 1000 * st.s + st.p));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  window.addEventListener("resize", resizeStars);
  resizeStars();
  requestAnimationFrame(drawStars);

  const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

  function moonInfo(date) {
    const synodic = 29.530588853;
    const ref = Date.UTC(2000, 0, 6, 18, 14);
    const days = (date.getTime() - ref) / 86400000;
    const age = ((days % synodic) + synodic) % synodic;
    const illum = Math.round((1 - Math.cos((2 * Math.PI * age) / synodic)) / 2 * 100);
    let name, icon;
    if (age < 1.85) { name = "Nouvelle Lune"; icon = "🌑"; }
    else if (age < 5.54) { name = "Premier croissant"; icon = "🌒"; }
    else if (age < 9.23) { name = "Premier quartier"; icon = "🌓"; }
    else if (age < 12.92) { name = "Gibbeuse croissante"; icon = "🌔"; }
    else if (age < 16.61) { name = "Pleine Lune"; icon = "🌕"; }
    else if (age < 20.30) { name = "Gibbeuse décroissante"; icon = "🌖"; }
    else if (age < 23.99) { name = "Dernier quartier"; icon = "🌗"; }
    else if (age < 27.68) { name = "Dernier croissant"; icon = "🌘"; }
    else { name = "Nouvelle Lune"; icon = "🌑"; }
    const toNew = synodic - age;
    const toFull = ((synodic / 2 - age) + synodic) % synodic;
    return { age, illum, name, icon, toNew, toFull };
  }

  function fmtDate(offsetDays) {
    const d = new Date(Date.now() + offsetDays * 86400000);
    return d.getDate() + " " + MONTHS[d.getMonth()];
  }

  function moonAnswer() {
    const m = moonInfo(new Date());
    return m.icon + " <b>" + m.name + "</b> aujourd'hui, illumination d'environ <b>" + m.illum + " %</b> (âge : " + m.age.toFixed(1) + " jours).\n\n" +
      "Prochaine Pleine Lune : vers le <b>" + fmtDate(m.toFull) + "</b>.\n" +
      "Prochaine Nouvelle Lune : vers le <b>" + fmtDate(m.toNew) + "</b>.\n\n" +
      "Calcul approximatif (±1 jour). Autour de la Nouvelle Lune, le ciel est le plus sombre : idéal pour les objets faibles (galaxies, nébuleuses). Le terminateur (la ligne jour/nuit) d'un croissant ou d'un quartier offre le meilleur relief aux jumelles et au télescope.";
  }

  function seasonAnswer() {
    const mth = new Date().getMonth();
    let s;
    if (mth >= 2 && mth <= 4) {
      s = "<b>Printemps</b> : Lion (Régulus), Grande Ourse bien haute, Bouvier avec Arcturus, Vierge (Spica) et son amas de galaxies. Saison des galaxies !";
    } else if (mth >= 5 && mth <= 7) {
      s = "<b>Été</b> : Triangle d'été (Véga, Deneb, Altaïr), Scorpion et Sagittaire bas au sud, la Voie lactée à son sommet. Idéal pour les amas globulaires et les nébuleuses (M8, M20, M13).";
    } else if (mth >= 8 && mth <= 10) {
      s = "<b>Automne</b> : Grand Carré de Pégase, Andromède et sa galaxie M31, Persée et le Double Amas, Cassiopée. Les Pléiades apparaissent en soirée.";
    } else {
      s = "<b>Hiver</b> : Orion et sa nébuleuse M42, Taureau (Aldébaran, Pléiades), Gémeaux, Grand Chien avec Sirius, la plus brillante des étoiles. Le ciel d'hiver est le plus riche en étoiles brillantes.";
    }
    return s + "\n\nPour un rendu précis à ta date et ta position, ouvre Stellarium (gratuit) ou Stellarium Web.";
  }

  const KB = [
    {
      id: "greet", keys: ["bonjour", "salut", "hello", "coucou", "bonsoir", "hey"],
      answer: () => "Bonsoir, observateur du ciel ! 🔭 Je peux t'aider sur la Lune, les planètes, les constellations, les étoiles filantes, le matériel, la photo ou les bonnes pratiques d'observation. Que veux-tu savoir ?"
    },
    {
      id: "moon", keys: ["lune", "phase", "lunaire", "pleine lune", "nouvelle lune", "croissant", "quartier"],
      answer: moonAnswer
    },
    {
      id: "season", keys: ["ce soir", "cette nuit", "que voir", "quoi observer", "visible", "saison", "constellation", "ciel du moment", "en ce moment"],
      answer: seasonAnswer
    },
    {
      id: "begin", keys: ["debut", "commencer", "debuter", "novice", "premiere fois", "premier", "demarrer", "apprendre"],
      answer: () => "<b>Bien débuter en astronomie</b> 🌌\n\n1. Commence à l'œil nu : apprends 3 ou 4 constellations (Grande Ourse, Cassiopée, Orion selon la saison).\n2. Installe une appli de carte du ciel (Stellarium, SkySafari, Star Walk).\n3. Passe aux jumelles (7x50 ou 10x50) avant d'acheter un télescope.\n4. Observe depuis un lieu sombre, laisse tes yeux s'adapter 20 à 30 minutes.\n5. Tiens un carnet d'observation : c'est motivant et on progresse vite.\n\nTu veux des conseils de matériel ?"
    },
    {
      id: "gear", keys: ["telescope", "jumelle", "materiel", "lunette", "equipement", "acheter", "dobson", "monture", "oculaire", "achat"],
      answer: () => "<b>Choisir son matériel</b> 🔭\n\n• <b>Jumelles 10x50</b> : le meilleur rapport qualité/prix pour débuter. Cratères lunaires, Pléiades, M31, Voie lactée.\n• <b>Télescope Dobson 150 à 200 mm</b> : la meilleure ouverture pour le prix, simple à utiliser. Idéal pour planètes, amas et galaxies.\n• <b>Lunette 70 à 90 mm</b> : légère et pratique, bonne pour Lune, planètes et ciel profond brillant.\n• <b>Maksutov / Schmidt-Cassegrain</b> : compacts, bons pour planétaire.\n\nRègle d'or : l'<b>ouverture</b> prime sur le grossissement. Le grossissement utile maximal est d'environ 2× le diamètre en mm. Méfie-toi des télescopes vendus sur des grossissements « x500 »."
    },
    {
      id: "planets", keys: ["planete", "jupiter", "saturne", "mars", "venus", "mercure", "uranus", "neptune", "systeme solaire"],
      answer: () => "<b>Observer les planètes</b> 🪐\n\n• <b>Vénus</b> : très brillante, au crépuscule ou à l'aube. Elle montre des phases, comme la Lune.\n• <b>Mars</b> : petit disque rouge, meilleur au moment des oppositions (environ tous les 26 mois).\n• <b>Jupiter</b> : à 50x, on voit les bandes nuageuses et les 4 satellites galiléens qui changent de place d'une nuit à l'autre.\n• <b>Saturne</b> : ses anneaux se distinguent dès 30 à 40x. Spectacle garanti.\n• <b>Mercure</b> : difficile, toujours proche du Soleil, à chercher à l'horizon.\n• <b>Uranus et Neptune</b> : télescope et carte indispensables.\n\nLes planètes se trouvent le long de l'<b>écliptique</b>, la même ligne que suit le Soleil. Pour savoir lesquelles sont visibles ce soir, consulte Stellarium ou in-the-sky.org."
    },
    {
      id: "meteors", keys: ["etoile filante", "filante", "meteore", "essaim", "perseides", "geminides", "orionides", "leonides", "quadrantides", "lyrides", "pluie d'etoiles"],
      answer: () => "<b>Principaux essaims de météores</b> ☄️\n\n• <b>Quadrantides</b> : 3-4 janvier (court mais intense)\n• <b>Lyrides</b> : 22 avril\n• <b>Êta Aquarides</b> : 5-6 mai\n• <b>Perséides</b> : 12-13 août (le classique de l'été)\n• <b>Orionides</b> : vers le 21 octobre\n• <b>Léonides</b> : 17-18 novembre\n• <b>Géminides</b> : 13-14 décembre (souvent le plus riche)\n\nConseils : pas besoin de télescope, allonge-toi sur un transat, regarde large vers le haut, laisse tes yeux s'adapter, et privilégie une nuit sans Lune brillante. Le pic a souvent lieu dans la seconde moitié de la nuit."
    },
    {
      id: "dark", keys: ["pollution", "lumineuse", "bortle", "ciel sombre", "site", "lieu", "ou observer", "endroit", "noir"],
      answer: () => "<b>Trouver un ciel sombre</b> 🌃\n\nLa pollution lumineuse se mesure avec l'<b>échelle de Bortle</b> (1 = ciel parfait, 9 = centre-ville). Dès Bortle 4 ou moins, la Voie lactée devient visible.\n\n• Utilise la carte <b>lightpollutionmap.info</b> pour repérer les zones sombres près de chez toi.\n• Cherche des réserves internationales de ciel étoilé (RICE) ou des clubs d'astronomie locaux, qui organisent des soirées d'observation.\n• Éloigne-toi des lampadaires, choisis un lieu dégagé à l'horizon sud.\n• Un filtre anti-pollution aide un peu pour certaines nébuleuses, mais rien ne vaut un vrai ciel noir."
    },
    {
      id: "adapt", keys: ["adaptation", "lampe rouge", "rouge", "vision nocturne", "yeux", "froid", "habiller", "preparer"],
      answer: () => "<b>Préparer sa soirée</b> 🧤\n\n• <b>Adaptation à l'obscurité</b> : compte 20 à 30 minutes sans lumière blanche pour une vision optimale.\n• Utilise une <b>lampe rouge</b> à faible intensité (le rouge préserve la vision nocturne). Baisse aussi la luminosité de ton téléphone et active le mode rouge de ton appli.\n• <b>Habille-toi chaudement</b> : on ne bouge pas, on a vite froid, même en été. Pense à un bonnet, des gants fins et une boisson chaude.\n• Sors le télescope 30 à 45 minutes avant pour qu'il se mette en température (sinon les images sont floues).\n• Utilise la <b>vision décalée</b> : regarder légèrement à côté d'un objet faible le fait ressortir."
    },
    {
      id: "photo", keys: ["photo", "astrophoto", "photographier", "appareil", "pose longue", "smartphone", "empilement", "stacking", "reflex"],
      answer: () => "<b>Astrophotographie</b> 📷\n\n<b>Pour débuter :</b>\n• Appareil photo (reflex ou hybride), objectif lumineux grand-angle (f/2.8 ou moins), trépied solide.\n• Règle des 500 : temps de pose max (s) ≈ 500 / focale (mm) pour éviter que les étoiles filent.\n• Exemple : 20 mm → environ 25 s. ISO 1600 à 3200, mise au point manuelle sur une étoile brillante.\n• Déclencheur à distance ou retardateur.\n\n<b>Pour aller plus loin :</b> monture équatoriale motorisée ou mini-trackeur (Star Adventurer), empilement de dizaines de poses avec <b>Siril</b> ou <b>DeepSkyStacker</b> (gratuits), puis traitement.\n\nLa Lune et les planètes se photographient très bien avec un smartphone collé à l'oculaire, ou mieux en vidéo suivie d'un empilement avec AutoStakkert."
    },
    {
      id: "deepsky", keys: ["messier", "nebuleuse", "galaxie", "amas", "andromede", "ciel profond", "deep sky", "pleiades", "orion", "m31", "m42", "m13", "ngc"],
      answer: () => "<b>Objets de ciel profond à voir</b> 🌠\n\n• <b>M31 Andromède</b> : la galaxie la plus proche, visible à l'œil nu en ciel noir (automne).\n• <b>M42 Nébuleuse d'Orion</b> : magnifique aux jumelles (hiver).\n• <b>M45 Pléiades</b> : amas ouvert spectaculaire aux jumelles.\n• <b>M13 Amas d'Hercule</b> : amas globulaire (été).\n• <b>M57 Nébuleuse de la Lyre</b> : petit anneau, télescope requis (été).\n• <b>M81/M82</b> : duo de galaxies dans la Grande Ourse (printemps).\n• <b>Double Amas de Persée</b> : superbe aux jumelles (automne).\n\nLe <b>catalogue Messier</b> (110 objets) est un excellent défi pour débuter : le « marathon Messier » consiste à tous les observer en une nuit de mars-avril !"
    },
    {
      id: "iss", keys: ["iss", "station spatiale", "satellite", "starlink", "passage"],
      answer: () => "<b>Station spatiale et satellites</b> 🛰️\n\nL'ISS est visible à l'œil nu comme un point très brillant qui traverse le ciel en 3 à 6 minutes, sans clignoter. Elle n'est visible qu'à l'aube ou au crépuscule, quand elle est encore éclairée par le Soleil alors que le sol est dans l'ombre.\n\nPour connaître les passages à ton endroit : <b>Heavens-Above</b>, <b>Spot the Station</b> (NASA) ou l'appli <b>ISS Detector</b>.\n\nLes trains de satellites Starlink, eux, forment un chapelet de points alignés juste après leur lancement."
    },
    {
      id: "eclipse", keys: ["eclipse", "occultation", "transit", "conjonction", "phenomene"],
      answer: () => "<b>Phénomènes à surveiller</b> 🌘\n\n• <b>Éclipse de Lune</b> : sans danger, visible à l'œil nu depuis toute la face nocturne de la Terre.\n• <b>Éclipse de Soleil</b> : <b>jamais sans protection</b> ! Utilise des lunettes certifiées ISO 12312-2 ou un filtre solaire adapté devant l'instrument. Les jumelles et télescopes sans filtre peuvent causer des lésions oculaires irréversibles.\n• <b>Conjonctions</b> : deux astres qui semblent proches dans le ciel (planètes, Lune). Beau spectacle à l'œil nu.\n• <b>Occultations</b> : la Lune cache une étoile ou une planète.\n\nPour les dates exactes : in-the-sky.org, IMCCE (Observatoire de Paris) ou timeanddate.com."
    },
    {
      id: "sun", keys: ["soleil", "tache solaire", "solaire", "filtre solaire", "protuberance", "halpha", "h-alpha"],
      answer: () => "<b>Observer le Soleil</b> ☀️\n\n⚠️ <b>Ne regarde jamais le Soleil sans filtre homologué</b> : risque de cécité immédiate et définitive.\n\n• Filtre <b>Baader AstroSolar</b> (film) placé à l'avant du télescope ou des jumelles : on voit les taches solaires.\n• Lunette ou télescope <b>H-alpha</b> dédié : protubérances et chromosphère, spectaculaire mais plus cher.\n• Méthode sûre et gratuite : la <b>projection</b> de l'image sur un carton avec une petite lunette (à surveiller de près, surtout avec des enfants).\n\nLe Soleil suit un cycle d'environ 11 ans, ses taches varient donc beaucoup d'une année à l'autre."
    },
    {
      id: "apps", keys: ["appli", "application", "logiciel", "stellarium", "carte du ciel", "app", "site web", "ressource"],
      answer: () => "<b>Outils indispensables</b> 📱\n\n• <b>Stellarium</b> (gratuit, PC/web/mobile) : simule le ciel à n'importe quelle date et lieu.\n• <b>SkySafari / Star Walk</b> : repérage sur smartphone.\n• <b>Heavens-Above</b> : satellites, ISS, planètes.\n• <b>in-the-sky.org</b> : calendrier des événements astronomiques.\n• <b>Clear Outside / Meteoblue</b> : météo dédiée à l'astronomie (nébulosité, seeing, transparence).\n• <b>lightpollutionmap.info</b> : carte de pollution lumineuse.\n• <b>Cartes du Ciel / Siril</b> : pour les plus avancés."
    },
    {
      id: "seeing", keys: ["seeing", "transparence", "meteo", "nuage", "turbulence", "conditions", "scintillement"],
      answer: () => "<b>Les conditions d'observation</b> 🌤️\n\n• <b>Nébulosité</b> : le critère de base. Pas de nuages, pas de ciel !\n• <b>Transparence</b> : clarté de l'air. Importante pour les objets faibles (galaxies, nébuleuses). Une atmosphère humide ou chargée en poussières la dégrade.\n• <b>Seeing</b> : stabilité de l'air. Il compte pour le planétaire et les étoiles doubles. Quand les étoiles scintillent beaucoup, le seeing est mauvais.\n\nAstuce : une nuit froide après le passage d'un front est souvent très transparente. Consulte Meteoblue Astronomy ou Clear Outside avant de sortir."
    },
    {
      id: "glossary", keys: ["magnitude", "ecliptique", "ascension droite", "declinaison", "zenith", "azimut", "definition", "glossaire", "c'est quoi", "qu'est-ce", "signifie", "annee-lumiere", "parsec", "focale", "ouverture"],
      answer: () => "<b>Petit glossaire</b> 📖\n\n• <b>Magnitude</b> : échelle de brillance, inversée. Plus le nombre est petit, plus l'astre est brillant. Œil nu en bon ciel : environ 6.\n• <b>Écliptique</b> : trajet apparent du Soleil, autour duquel s'alignent planètes et Lune.\n• <b>Zénith</b> : point juste au-dessus de ta tête.\n• <b>Ascension droite / déclinaison</b> : coordonnées célestes (longitude/latitude du ciel).\n• <b>Année-lumière</b> : distance parcourue par la lumière en un an, soit environ 9 460 milliards de km.\n• <b>Ouverture</b> : diamètre de l'objectif ou du miroir. Plus il est grand, plus on capte de lumière.\n• <b>Focale</b> : distance entre l'objectif et le plan focal. Grossissement = focale / focale oculaire."
    },
    {
      id: "doubles", keys: ["double", "etoile double", "albireo", "mizar", "couleur", "etoile"],
      answer: () => "<b>Étoiles doubles et étoiles remarquables</b> ✨\n\n• <b>Albireo</b> (Cygne) : une belle double aux couleurs contrastées, orange et bleue. Un classique, même à petit grossissement.\n• <b>Mizar et Alcor</b> (Grande Ourse) : séparables à l'œil nu pour une bonne vue, Mizar elle-même se dédouble au télescope.\n• <b>Bételgeuse</b> (rouge) et <b>Rigel</b> (bleue) dans Orion : un beau contraste de couleurs.\n• <b>Polaris</b> : l'étoile Polaire, quasi fixe, repère le nord. Trouve-la en prolongeant 5 fois la distance entre les deux étoiles de l'arrière du « Chariot ».\n\nLes étoiles doubles sont un excellent terrain d'entraînement, même depuis un ciel urbain."
    },
    {
      id: "polaris", keys: ["polaire", "nord", "orienter", "trouver le nord", "chariot", "grande ourse", "cassiopee"],
      answer: () => "<b>S'orienter dans le ciel</b> 🧭\n\nPour trouver <b>Polaris</b> (l'étoile Polaire) : repère la Grande Ourse (le « Chariot »), prends les deux étoiles du bord arrière de la casserole et prolonge leur direction d'environ 5 fois leur écartement. Tu tombes sur Polaris, qui indique le nord.\n\nAlternative : <b>Cassiopée</b> (en forme de W ou M) se trouve de l'autre côté de Polaris par rapport à la Grande Ourse.\n\nDepuis Polaris, l'angle au-dessus de l'horizon nord correspond à ta latitude (environ 49° pour Paris)."
    },
    {
      id: "thanks", keys: ["merci", "super", "genial", "top", "parfait", "cool"],
      answer: () => "Avec plaisir ! 🌟 Si tu as d'autres questions, je suis là. Ciel dégagé et bonnes observations !"
    },
    {
      id: "bye", keys: ["au revoir", "bye", "a bientot", "salut a", "ciao", "bonne nuit"],
      answer: () => "À bientôt, et bon ciel ! 🌙"
    },
    {
      id: "who", keys: ["qui es-tu", "qui es tu", "tu es qui", "ton nom", "tu peux faire", "aide", "help", "que sais-tu", "capable"],
      answer: () => "Je suis <b>Astro-Guide</b>, un petit assistant pour passionnés d'astronomie. Je peux te parler de : la Lune du jour, ce qu'on voit selon la saison, les planètes, les essaims d'étoiles filantes, le ciel profond, le matériel, la photo, la pollution lumineuse, l'ISS, les éclipses, l'observation du Soleil, et un petit glossaire. Essaie une des suggestions ci-dessous !"
    }
  ];

  const FALLBACK = [
    "Je n'ai pas bien compris. Essaie avec des mots-clés comme « Lune », « Jupiter », « télescope », « Perséides » ou « pollution lumineuse ».",
    "Hmm, cette question dépasse ma carte du ciel. Tu peux la reformuler, ou me demander par exemple ce qu'on peut voir ce soir.",
    "Je ne connais pas encore ce sujet. Tape « aide » pour voir ce que je sais faire."
  ];
  let fallbackIdx = 0;

  const CHIPS = [
    "Phase de la Lune",
    "Que voir cette saison ?",
    "Bien débuter",
    "Quel matériel choisir ?",
    "Étoiles filantes",
    "Observer les planètes",
    "Éviter la pollution lumineuse",
    "Photographier le ciel",
    "Passages de l'ISS"
  ];

  function normalize(s) {
    return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’‘]/g, "'");
  }

  function findAnswer(question) {
    const q = normalize(question);
    let best = null, bestScore = 0;
    for (const item of KB) {
      let score = 0;
      for (const k of item.keys) {
        const nk = normalize(k);
        if (q.includes(nk)) score += nk.length >= 6 ? 3 : 2;
      }
      if (score > bestScore) { bestScore = score; best = item; }
    }
    if (best && bestScore > 0) return best.answer();
    const out = FALLBACK[fallbackIdx % FALLBACK.length];
    fallbackIdx++;
    return out;
  }

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const chipsBox = document.getElementById("chips");

  function addMessage(html, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    if (who === "user") div.textContent = html;
    else div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function reply(question) {
    const typing = addMessage('<span class="typing"><span></span><span></span><span></span></span>', "bot");
    const delay = 450 + Math.random() * 450;
    setTimeout(function () {
      typing.innerHTML = findAnswer(question);
      chat.scrollTop = chat.scrollHeight;
    }, delay);
  }

  function send(text) {
    const t = text.trim();
    if (!t) return;
    addMessage(t, "user");
    reply(t);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    send(input.value);
    input.value = "";
    input.focus();
  });

  CHIPS.forEach(function (label) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = label;
    b.addEventListener("click", function () { send(label); });
    chipsBox.appendChild(b);
  });

  addMessage("Bienvenue, observateur ! 🔭✨\nJe suis <b>Astro-Guide</b>, ton assistant pour explorer le ciel. Pose-moi une question ou clique sur une suggestion ci-dessous.", "bot");
  input.focus();
})();
</script>
